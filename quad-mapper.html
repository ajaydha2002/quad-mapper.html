<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MadMapper Web Pro (Open-Source Clone)</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #181818; color: #ddd; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top Menu Bar */
        #menubar { height: 35px; background: #222; border-bottom: 1px solid #333; display: flex; align-items: center; padding: 0 15px; justify-content: space-between; font-size: 13px; }
        .menu-group { display: flex; gap: 15px; align-items: center; }
        .badge { background: #007acc; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; }

        /* Main Workspace Layout */
        #workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Left Sidebar */
        #sidebar-left { width: 260px; background: #202020; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .panel-header { padding: 10px 12px; background: #282828; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .surface-tree { flex: 1; overflow-y: auto; padding: 8px; }
        .tree-item { padding: 8px 10px; margin-bottom: 4px; background: #2a2a2a; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; border-left: 3px solid #555; }
        .tree-item.active { background: #333; border-left-color: #007acc; color: #fff; }
        
        /* Center Canvas Workspace */
        #viewport-container { flex: 1; position: relative; background: #121212; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        canvas { display: block; background: #1a1a1a; box-shadow: 0 0 20px rgba(0,0,0,0.8); cursor: crosshair; }

        /* Right Sidebar: Property Inspector */
        #sidebar-right { width: 300px; background: #202020; border-left: 1px solid #333; display: flex; flex-direction: column; padding: 12px; overflow-y: auto; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        .control-group input, .control-group select { width: 100%; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 13px; }
        
        /* Buttons */
        button { background: #333; border: 1px solid #444; color: #fff; padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 4px; width: 100%; transition: background 0.2s; }
        button:hover { background: #444; }
        button.primary { background: #007acc; border-color: #0062a3; }
        button.primary:hover { background: #0086e6; }

        /* Fullscreen Output Overlay */
        #output-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vw; background: #000; z-index: 9999; display: none; }
        #output-overlay canvas { width: 100% !important; height: 100% !important; }
        #exit-output { position: fixed; top: 20px; right: 20px; z-index: 10000; background: rgba(0,0,0,0.7); border: 1px solid #666; color: #fff; padding: 8px 16px; border-radius: 4px; cursor: pointer; display: none; }
    </style>
</head>
<body>

    <!-- Top Menu Bar -->
    <div id="menubar">
        <div class="menu-group">
            <strong>MadMapper Web Pro</strong>
            <span class="badge">मारवाड़ DJ Edition</span>
        </div>
        <div class="menu-group">
            <button class="primary" id="toggleOutputBtn" style="width: auto; padding: 3px 12px;">🖥️ Fullscreen Output Mode</button>
        </div>
    </div>

    <!-- Main Workspace -->
    <div id="workspace">
        <!-- Left: Shapes & Surfaces -->
        <div id="sidebar-left">
            <div class="panel-header"><span>Add New Shape</span></div>
            <div style="padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                <button id="addSquareBtn">+ Square</button>
                <button id="addTriangleBtn">+ Triangle</button>
                <button id="addCircleBtn">+ Circle</button>
                <button id="addRandomBtn">+ Random</button>
            </div>
            <div class="panel-header" style="border-top: 1px solid #333;"><span>Active Surfaces</span></div>
            <div class="surface-tree" id="surfaceList"></div>
        </div>

        <!-- Center: Interactive Viewport -->
        <div id="viewport-container">
            <canvas id="glCanvas" width="1024" height="768"></canvas>
        </div>

        <!-- Right: Property Inspector -->
        <div id="sidebar-right">
            <div class="panel-header" style="margin-bottom: 12px;">Inspector</div>
            <div id="inspectorContent">
                <p style="color: #777; font-size: 12px;">Select a surface to edit properties.</p>
            </div>
        </div>
    </div>

    <!-- Fullscreen Output Overlay -->
    <div id="output-overlay"></div>
    <button id="exit-output">Exit Fullscreen Output</button>
    <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none">

    <script>
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl');
        if (!gl) alert('WebGL not supported!');

        gl.viewport(0, 0, canvas.width, canvas.height);

        const vsSource = `
            attribute vec2 a_position;
            attribute vec2 a_texCoord;
            varying vec2 v_texCoord;
            void main() {
                vec2 clipSpace = (a_position / vec2(1024.0, 768.0)) * 2.0 - 1.0;
                gl_Position = vec4(clipSpace * vec2(1, -1), 0.0, 1.0);
                v_texCoord = a_texCoord;
            }
        `;
        const fsSource = `
            precision mediump float;
            uniform sampler2D u_image;
            varying vec2 v_texCoord;
            void main() {
                gl_FragColor = texture2D(u_image, v_texCoord);
            }
        `;

        function createShader(gl, type, source) {
            const s = gl.createShader(type);
            gl.shaderSource(s, source);
            gl.compileShader(s);
            return s;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        // Procedural Texture Canvas
        const defaultTexCanvas = document.createElement('canvas');
        defaultTexCanvas.width = 512; defaultTexCanvas.height = 512;
        const dtCtx = defaultTexCanvas.getContext('2d');

        function updateDefaultTexture() {
            dtCtx.fillStyle = '#222222'; 
            dtCtx.fillRect(0, 0, 512, 512);
            
            dtCtx.strokeStyle = '#00ffff'; 
            dtCtx.lineWidth = 16;
            dtCtx.strokeRect(20, 20, 472, 472);

            dtCtx.fillStyle = '#ff00ff';
            dtCtx.font = 'bold 42px sans-serif';
            dtCtx.textAlign = 'center';
            dtCtx.fillText("मारवाड़ DJ", 256, 230);

            dtCtx.fillStyle = `hsl(${Date.now() / 15 % 360}, 100%, 50%)`;
            dtCtx.beginPath(); 
            dtCtx.arc(256, 330, 45, 0, Math.PI * 2); 
            dtCtx.fill();
        }
        updateDefaultTexture();

        let surfaces = [
            {
                id: 1,
                name: "Square Surface",
                type: "Square",
                vertices: [[150, 150], [450, 150], [150, 450], [450, 450]],
                texCoords: [[0,0], [1,0], [0,1], [1,1]],
                opacity: 1.0,
                mediaName: "Default Procedural",
                mediaType: "default",
                mediaElement: defaultTexCanvas,
                texture: gl.createTexture()
            }
        ];
        let activeSurfaceId = 1;
        let interactionMode = null;

        // Initialize textures properly with FLIP_Y
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        surfaces.forEach(s => {
            gl.bindTexture(gl.TEXTURE_2D, s.texture);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, s.mediaElement);
        });

        function updateUI() {
            const listEl = document.getElementById('surfaceList');
            listEl.innerHTML = '';
            surfaces.forEach(s => {
                const div = document.createElement('div');
                div.className = `tree-item ${s.id === activeSurfaceId ? 'active' : ''}`;
                div.innerHTML = `<span>${s.name}</span><span style="font-size:10px; color:#888;">${s.type}</span>`;
                div.onclick = () => { activeSurfaceId = s.id; updateUI(); };
                listEl.appendChild(div);
            });
            updateInspector();
        }

        function updateInspector() {
            const insp = document.getElementById('inspectorContent');
            const s = surfaces.find(item => item.id === activeSurfaceId);
            if (!s) {
                insp.innerHTML = '<p style="color: #777; font-size: 12px;">No surface selected.</p>';
                return;
            }

            let coordsHtml = '';
            s.vertices.forEach((v, idx) => {
                coordsHtml += `Node ${idx + 1}: ${Math.round(v[0])}, ${Math.round(v[1])}<br>`;
            });

            insp.innerHTML = `
                <div class="control-group">
                    <label>Surface Name</label>
                    <input type="text" id="surfNameInput" value="${s.name}">
                </div>
                <div class="control-group">
                    <label>Shape Type: <strong>${s.type}</strong></label>
                </div>
                <div class="control-group">
                    <label>Assigned Media Source</label>
                    <div style="font-size: 12px; color: #007acc; margin-bottom: 5px; overflow: hidden; text-overflow: ellipsis;">${s.mediaName}</div>
                    <button id="changeMediaBtn">📁 Choose Media File</button>
                </div>
                <div class="control-group">
                    <label>Opacity (${Math.round(s.opacity * 100)}%)</label>
                    <input type="range" id="opacityInput" min="0" max="1" step="0.05" value="${s.opacity}">
                </div>
                <div class="control-group">
                    <label>Relocation / Vertices</label>
                    <div style="font-size: 11px; color: #aaa; margin-bottom: 5px;">Tip: Drag inside a shape to move/relocate it, or drag corner nodes to warp.</div>
                    <div style="font-size: 11px; color: #0ff; font-family: monospace;">${coordsHtml}</div>
                </div>
            `;

            document.getElementById('surfNameInput').oninput = (e) => { s.name = e.target.value; updateUI(); };
            document.getElementById('opacityInput').oninput = (e) => { s.opacity = parseFloat(e.target.value); };
            document.getElementById('changeMediaBtn').onclick = () => { document.getElementById('mediaInput').click(); };
        }

        function addShape(type) {
            const newId = surfaces.length > 0 ? Math.max(...surfaces.map(item => item.id)) + 1 : 1;
            const newTex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, newTex);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, defaultTexCanvas);

            let vertices, texCoords, name;
            if (type === 'Square') {
                name = `Square ${newId}`;
                vertices = [[200, 200], [500, 200], [200, 500], [500, 500]];
                texCoords = [[0,0], [1,0], [0,1], [1,1]];
            } else if (type === 'Triangle') {
                name = `Triangle ${newId}`;
                vertices = [[350, 180], [200, 480], [500, 480]];
                texCoords = [[0.5, 0], [0, 1], [1, 1]];
            } else if (type === 'Circle') {
                name = `Circle / Disc ${newId}`;
                vertices = [[350, 350], [350, 220], [430, 260], [470, 350], [430, 440], [350, 480], [270, 440], [230, 350], [270, 260]];
                texCoords = vertices.map(v => [(v[0]-230)/240, (v[1]-220)/260]);
            } else if (type === 'Random') {
                name = `Random Polygon ${newId}`;
                vertices = [[250, 250], [480, 200], [550, 420], [400, 520], [200, 440]];
                texCoords = vertices.map(v => [(v[0]-200)/350, (v[1]-200)/320]);
            }

            surfaces.push({
                id: newId, name, type, vertices, texCoords,
                opacity: 1.0, mediaName: "Default Procedural", mediaType: "default",
                mediaElement: defaultTexCanvas, texture: newTex
            });
            activeSurfaceId = newId;
            updateUI();
        }

        document.getElementById('addSquareBtn').onclick = () => addShape('Square');
        document.getElementById('addTriangleBtn').onclick = () => addShape('Triangle');
        document.getElementById('addCircleBtn').onclick = () => addShape('Circle');
        document.getElementById('addRandomBtn').onclick = () => addShape('Random');

        document.getElementById('mediaInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            const s = surfaces.find(item => item.id === activeSurfaceId);
            if (!s) return;

            s.mediaName = file.name;
            if (file.type.startsWith('video/')) {
                const vid = document.createElement('video');
                vid.src = url; vid.loop = true; vid.muted = true; vid.autoplay = true; vid.play();
                s.mediaType = 'video'; s.mediaElement = vid;
            } else if (file.type.startsWith('image/')) {
                const img = new Image(); img.src = url;
                s.mediaType = 'image'; s.mediaElement = img;
            }
            updateInspector();
        };

        function isPointInPolygon(pt, vs) {
            let x = pt[0], y = pt[1];
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                let xi = vs[i][0], yi = vs[i][1];
                let xj = vs[j][0], yj = vs[j][1];
                let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let foundVertex = false;
            surfaces.forEach((s, sIdx) => {
                s.vertices.forEach((v, vIdx) => {
                    if (Math.hypot(v[0] - mouseX, v[1] - mouseY) < 25) {
                        activeSurfaceId = s.id;
                        interactionMode = { type: 'vertex', sIdx, vIdx };
                        foundVertex = true;
                        updateUI();
                    }
                });
            });
            if (foundVertex) return;

            for (let sIdx = surfaces.length - 1; sIdx >= 0; sIdx--) {
                const s = surfaces[sIdx];
                if (isPointInPolygon([mouseX, mouseY], s.vertices)) {
                    activeSurfaceId = s.id;
                    interactionMode = {
                        type: 'shape',
                        sIdx,
                        startX: mouseX,
                        startY: mouseY,
                        origVertices: s.vertices.map(v => [...v])
                    };
                    updateUI();
                    return;
                }
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!interactionMode) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = Math.max(0, Math.min(canvas.width, e.clientX - rect.left));
            const mouseY = Math.max(0, Math.min(canvas.height, e.clientY - rect.top));

            if (interactionMode.type === 'vertex') {
                surfaces[interactionMode.sIdx].vertices[interactionMode.vIdx] = [mouseX, mouseY];
            } else if (interactionMode.type === 'shape') {
                const dx = mouseX - interactionMode.startX;
                const dy = mouseY - interactionMode.startY;
                const s = surfaces[interactionMode.sIdx];
                s.vertices = interactionMode.origVertices.map(v => [v[0] + dx, v[1] + dy]);
            }
            updateInspector();
        });

        window.addEventListener('mouseup', () => { interactionMode = null; });

        document.getElementById('toggleOutputBtn').onclick = () => {
            document.getElementById('output-overlay').style.display = 'block';
            document.getElementById('exit-output').style.display = 'block';
        };
        document.getElementById('exit-output').onclick = () => {
            document.getElementById('output-overlay').style.display = 'none';
            document.getElementById('exit-output').style.display = 'none';
        };

        const posBuffer = gl.createBuffer();
        const texBuffer = gl.createBuffer();

        function render() {
            updateDefaultTexture();
            gl.clearColor(0.1, 0.1, 0.1, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            surfaces.forEach(s => {
                gl.bindTexture(gl.TEXTURE_2D, s.texture);
                gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
                if (s.mediaType === 'video' && s.mediaElement.readyState >= 2) {
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, s.mediaElement);
                } else if (s.mediaType === 'image' && s.mediaElement.complete) {
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, s.mediaElement);
                } else {
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, defaultTexCanvas);
                }

                let drawMode = gl.TRIANGLE_STRIP;
                let flatPos = [];
                let flatTex = [];

                if (s.type === 'Square') {
                    flatPos = [s.vertices[0][0],s.vertices[0][1], s.vertices[1][0],s.vertices[1][1], s.vertices[2][0],s.vertices[2][1], s.vertices[3][0],s.vertices[3][1]];
                    flatTex = [0,0, 1,0, 0,1, 1,1];
                } else if (s.type === 'Triangle') {
                    flatPos = [s.vertices[0][0],s.vertices[0][1], s.vertices[1][0],s.vertices[1][1], s.vertices[2][0],s.vertices[2][1]];
                    flatTex = [0.5,0, 0,1, 1,1];
                } else {
                    drawMode = gl.TRIANGLES;
                    const centerV = [
                        s.vertices.reduce((sum, v) => sum + v[0], 0) / s.vertices.length,
                        s.vertices.reduce((sum, v) => sum + v[1], 0) / s.vertices.length
                    ];
                    for (let i = 0; i < s.vertices.length; i++) {
                        let nextI = (i + 1) % s.vertices.length;
                        flatPos.push(centerV[0], centerV[1], s.vertices[i][0], s.vertices[i][1], s.vertices[nextI][0], s.vertices[nextI][1]);
                        flatTex.push(0.5, 0.5, s.texCoords[i][0], s.texCoords[i][1], s.texCoords[nextI][0], s.texCoords[nextI][1]);
                    }
                }

                gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(flatPos), gl.STATIC_DRAW);

                gl.bindBuffer(gl.ARRAY_BUFFER, texBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(flatTex), gl.STATIC_DRAW);

                const posAttr = gl.getAttribLocation(program, "a_position");
                gl.enableVertexAttribArray(posAttr);
                gl.vertexAttribPointer(posAttr, 2, gl.FLOAT, false, 0, 0);

                const texAttr = gl.getAttribLocation(program, "a_texCoord");
                gl.enableVertexAttribArray(texAttr);
                gl.vertexAttribPointer(texAttr, 2, gl.FLOAT, false, 0, 0);

                gl.drawArrays(drawMode, 0, flatPos.length / 2);
            });

            requestAnimationFrame(render);
        }

        updateUI();
        render();
    </script>
</body>
</html>
